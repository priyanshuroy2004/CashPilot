version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cashpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashpilot
      POSTGRES_USER: cashpilot
      POSTGRES_PASSWORD: cashpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cashpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashpilot -d cashpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cashpilot_pgdata:
    driver: local
