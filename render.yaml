services:
  # ── Backend Web Service (FastAPI) ───────────────────────────
  - type: web
    name: cashpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashpilot-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://*.vercel.app

databases:
  # ── Managed PostgreSQL Database ─────────────────────────────
  - name: cashpilot-postgres
    databaseName: cashpilot
    user: cashpilot
    plan: free
    region: oregon
